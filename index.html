
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff7e8">
  <title>Fincan Falı — Kahvenin güzel hatırına</title>
  <style>
    :root {
      color-scheme: light;
      --coffee: #7a4a2d;
      --coffee-dark: #53321f;
      --secondary: #6b625b;
      --cream: #fff7e8;
      --terracotta: #c36b4e;
      --surface: #ffffff;
      --border: #e6d3ba;
      --success: #2f7d32;
      --error: #b42318;
      --shadow: 0 18px 48px rgba(83, 50, 31, 0.09);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--coffee-dark);
      background:
        radial-gradient(ellipse at 8% 8%, rgba(195, 107, 78, .09), transparent 30rem),
        var(--cream);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    button, input { font: inherit; }

    button:focus-visible, .upload-label:focus-visible {
      outline: 3px solid rgba(195, 107, 78, .45);
      outline-offset: 3px;
    }

    .page {
      width: min(100% - 32px, 720px);
      margin: 0 auto;
      padding: 30px 0 36px;
    }

    header { text-align: center; margin-bottom: 24px; }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--coffee);
      font-size: 14px;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .brand-icon {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: #fffaf1;
      font-size: 19px;
      letter-spacing: 0;
    }

    h1 {
      margin: 15px 0 7px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 7vw, 44px);
      font-weight: 600;
      letter-spacing: -.035em;
      line-height: 1.12;
    }

    .subtitle {
      max-width: 470px;
      margin: 0 auto;
      color: var(--secondary);
      font-size: 15px;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .upload-card { padding: clamp(18px, 5vw, 28px); }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 11px;
      margin: 0 0 5px;
      font-size: 18px;
      font-weight: 700;
    }
